spring.application.name=main-service

# Database Configuration
# NOTE: In production, set these via environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) rather than committing real
# credentials to source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seedsanskritiDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server Configuration
server.port=${SERVER_PORT:8081}

# JWT Configuration
# NOTE: jwt.secret MUST be overridden with a long, random value via the
# JWT_SECRET environment variable in any non-local environment, and MUST be
# the same value configured in payment-service (both services verify the
# same token).
jwt.secret=${JWT_SECRET:SeedSanskritiSecretKeyForJwtAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Shared secret used to authorize this service's server-to-server calls to
# payment-service's /internal/** endpoints. MUST match payment-service's
# internal.api.key. Override via env var in every environment.
internal.api.key=${INTERNAL_API_KEY:change-me-shared-internal-secret}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Mail / Password Reset
# app.mail.enabled=false (default) logs the reset email instead of sending
# it, so password reset works out of the box with no SMTP setup. Set to
# true and provide real MAIL_* env vars to actually deliver emails.
app.mail.enabled=${MAIL_ENABLED:false}
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:seedsanskriti@gmail.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka / Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Feign
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

# Logging
# TRACE/DEBUG security & web logging is useful locally but noisy (and can
# leak request details) in production - override via LOG_LEVEL_SECURITY /
# LOG_LEVEL_WEB env vars when deploying.
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.seedsanskriti.client=${LOG_LEVEL_FEIGN:INFO}
