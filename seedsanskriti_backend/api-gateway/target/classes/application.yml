server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-route
              uri: lb://main-service
              predicates:
                - Path=/api/auth/**

            - id: products-route
              uri: lb://main-service
              predicates:
                - Path=/api/products/**
              filters:
                - JwtAuth

            - id: reviews-route
              uri: lb://main-service
              predicates:
                - Path=/api/reviews/**
              filters:
                - JwtAuth

            - id: cart-route
              uri: lb://main-service
              predicates:
                - Path=/api/cart/**
              filters:
                - JwtAuth

            - id: wishlist-route
              uri: lb://main-service
              predicates:
                - Path=/api/wishlist/**
              filters:
                - JwtAuth

            - id: orders-route
              uri: lb://main-service
              predicates:
                - Path=/api/orders/**
              filters:
                - JwtAuth

            - id: payments-route
              uri: lb://main-service
              predicates:
                - Path=/api/payments/**
              filters:
                - JwtAuth

            - id: deliveries-route
              uri: lb://main-service
              predicates:
                - Path=/api/deliveries/**
              filters:
                - JwtAuth

            - id: admin-route
              uri: lb://main-service
              predicates:
                - Path=/api/admin/**
              filters:
                - JwtAuth

            - id: supplier-route
              uri: lb://main-service
              predicates:
                - Path=/api/supplier/**
              filters:
                - JwtAuth

            - id: users-route
              uri: lb://main-service
              predicates:
                - Path=/api/users/**
              filters:
                - JwtAuth

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:SeedSanskritiSecretKeyForJwtAuthentication2026}

logging:
  level:
    org.springframework.cloud.gateway: INFO