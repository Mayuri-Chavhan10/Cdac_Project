spring.application.name=payment-service

# Database Configuration - separate schema/database from main-service,
# per the migration plan (Payment data is fully isolated from Orders/Users).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seedsanskriti_payments_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server Configuration
server.port=${SERVER_PORT:8082}

# JWT Configuration
# MUST be the same secret configured in main-service - this service only
# verifies tokens issued by main-service's AuthService, it never issues its
# own.
jwt.secret=${JWT_SECRET:SeedSanskritiSecretKeyForJwtAuthentication2026}

# Shared secret that authorizes calls to /internal/**. Only main-service
# should ever call these endpoints - the API Gateway does NOT route to them.
# MUST match main-service's internal.api.key. Override via env var in every
# environment; never commit a real value.
internal.api.key=${INTERNAL_API_KEY:change-me-shared-internal-secret}

# Razorpay
# Set RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET as environment variables.
# Never commit real values here - these default to blank so the app still
# boots locally without them (Razorpay endpoints will simply fail until set).
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TIUTeB5iaD6erK}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:CQyERicrLxYSew6dJqmCW9n4}

# Eureka / Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Logging
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.com.seedsanskriti.payment=${LOG_LEVEL_APP:INFO}
